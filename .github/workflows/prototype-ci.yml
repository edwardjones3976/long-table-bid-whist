name: Prototype CI

on:
  pull_request:
  push:
    branches:
      - main
      - milestone/accepted-webxr-prototype
  workflow_dispatch:

concurrency:
  group: prototype-ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled. A run that may be deploying
  # (push to main or manual dispatch) is never cancelled mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Record deterministic dist digest
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s dist/index.html
          manifest="${RUNNER_TEMP}/dist-manifest.txt"
          (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "${manifest}"
          digest="$(sha256sum "${manifest}" | cut -d ' ' -f 1)"
          {
            echo "## Stage 1 exact artifact"
            echo
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- dist content digest (SHA-256 of the sorted manifest): \`${digest}\`"
            echo
            echo '<details><summary>dist content manifest</summary>'
            echo
            echo '```'
            cat "${manifest}"
            echo '```'
            echo
            echo '</details>'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the already-built dist as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  deploy-pages:
    needs: test-and-build
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/milestone/accepted-webxr-prototype')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
